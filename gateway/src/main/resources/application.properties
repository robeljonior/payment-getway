spring.application.name=payment-gateway

# Database (PostgreSQL). Override with environment variables DB_URL, DB_USER and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gateway}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration

# Strict JSON: unknown fields are rejected, and numbers are never turned into strings
# (amounts must be strings like "1500.00", never floats; see StrictJsonConfig).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=always

server.port=${PORT:8080}

# The orchestrator service (Go). INTERNAL_TOKEN must be the same secret in both services.
gateway.orchestrator.url=${ORCHESTRATOR_URL:http://localhost:8090}
gateway.orchestrator.token=${INTERNAL_TOKEN:}
gateway.orchestrator.timeout-ms=5000

# Rate limits from docs/core/api-conventions.md section 7.
gateway.rate-limit.per-key-per-second=100
gateway.rate-limit.per-key-burst=200
gateway.rate-limit.create-session-per-second=50
gateway.rate-limit.per-ip-per-second=20
